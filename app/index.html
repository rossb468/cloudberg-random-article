<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Admiral Cloudberg</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✈️</text></svg>">
<style>
  :root {
    --bg: #0b0d12;
    --bg-alt: #12151d;
    --card: #171b25;
    --border: #262c3a;
    --text: #e7e9ee;
    --text-dim: #9aa1b2;
    --accent: #e8a33d;
    --accent-dim: #b57f2e;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: radial-gradient(1200px 800px at 50% -10%, #1a1f2b 0%, var(--bg) 55%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 32px 16px 48px;
  }
  header {
    text-align: center;
    margin-bottom: 28px;
  }
  header h1 {
    font-size: 1.5rem;
    margin: 0 0 6px;
    letter-spacing: 0.02em;
    font-weight: 700;
  }
  header h1 .plane { display: inline-block; transform: translateY(-1px); }
  header p {
    margin: 0;
    color: var(--text-dim);
    font-size: 0.92rem;
  }
  header p a { color: var(--accent); text-decoration: none; }
  header p a:hover { text-decoration: underline; }

  main {
    width: 100%;
    max-width: 640px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 20px 60px -20px rgba(0,0,0,0.6);
    opacity: 0;
    transform: translateY(8px);
    animation: rise 0.45s ease forwards;
  }
  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }

  .cover {
    width: 100%;
    aspect-ratio: 16 / 8;
    background: #1e2330 center/cover no-repeat;
    display: block;
  }
  .cover.placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.5rem;
    color: var(--border);
  }

  .content { padding: 26px 28px 28px; }

  .meta-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 0.78rem;
    color: var(--text-dim);
    margin-bottom: 14px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .meta-row span::after {
    content: "•";
    margin-left: 10px;
    color: var(--border);
  }
  .meta-row span:last-child::after { content: ""; }

  h2.title {
    font-size: 1.5rem;
    line-height: 1.3;
    margin: 0 0 12px;
    font-weight: 700;
  }

  p.subtitle {
    color: var(--text-dim);
    line-height: 1.6;
    font-size: 0.98rem;
    margin: 0 0 24px;
  }

  .actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  button, .read-link {
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    border-radius: 10px;
    padding: 12px 18px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: transform 0.08s ease, filter 0.15s ease;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  button:active, .read-link:active { transform: scale(0.97); }

  #randomBtn {
    background: var(--accent);
    color: #1a1400;
  }
  #randomBtn:hover { filter: brightness(1.08); }
  #randomBtn:disabled { opacity: 0.6; cursor: default; }

  .read-link {
    background: transparent;
    border-color: var(--border);
    color: var(--text);
  }
  .read-link:hover { border-color: var(--accent-dim); color: var(--accent); }

  footer {
    margin-top: 28px;
    color: var(--text-dim);
    font-size: 0.8rem;
    text-align: center;
  }

  .counter {
    margin-top: 14px;
    text-align: center;
    color: var(--text-dim);
    font-size: 0.8rem;
  }

  @media (max-width: 480px) {
    .content { padding: 20px 20px 22px; }
    h2.title { font-size: 1.25rem; }
  }
</style>
</head>
<body>

<header>
  <h1><span class="plane">✈️</span> Random Admiral Cloudberg</h1>
  <p>A random deep-dive from <a href="https://admiralcloudberg.medium.com" target="_blank" rel="noopener">Admiral Cloudberg</a> on Medium</p>
</header>

<main>
  <div class="card" id="card">
    <img class="cover" id="cover" alt="">
    <div class="content">
      <div class="meta-row" id="metaRow"></div>
      <h2 class="title" id="title"></h2>
      <p class="subtitle" id="subtitle"></p>
      <div class="actions">
        <button id="randomBtn">🎲 New random article</button>
        <a class="read-link" id="readLink" href="#" target="_blank" rel="noopener">Read full article ↗</a>
      </div>
    </div>
  </div>
  <div class="counter" id="counter"></div>
</main>

<footer>
  Article data pulled from Admiral Cloudberg's public Medium archive.<br>
  All writing belongs to Admiral Cloudberg — this is just a random-article picker.
</footer>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
